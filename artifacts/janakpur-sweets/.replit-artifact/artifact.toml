kind = "web"
previewPath = "/"
title = "Janakpur Sweets"
version = "1.0.0"
id = "artifacts/janakpur-sweets"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24668

[services.development]
run = "pnpm --filter @workspace/janakpur-sweets run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/janakpur-sweets", "run", "build" ]
publicDir = "artifacts/janakpur-sweets/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24668"
BASE_PATH = "/"
